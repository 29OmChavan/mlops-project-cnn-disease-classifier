version: "3.9"

services:
  cnn-disease-classifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: 29omchavan/mlops-project-2-cnn-disease-classifier:latest
    container_name: cnn-disease-classifier
    ports:
      - "8080:8080"
    environment:
      - MLFLOW_TRACKING_URI=https://dagshub.com/29omchavan/mlops-project-2-cnn-disease-classifier.mlflow
    restart: unless-stopped
