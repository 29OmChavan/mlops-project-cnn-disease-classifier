artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  dataset_dir: artifacts/data_ingestion/dataset
  classes:
    - Coccidiosis
    - Healthy
    - Newcastle_Disease
    - Salmonella
  samples_per_class: 80
  val_split: 0.25

prepare_base_model:
  root_dir: artifacts/prepare_base_model
  base_model_path: artifacts/prepare_base_model/base_model.pt
  updated_base_model_path: artifacts/prepare_base_model/base_model_updated.pt

training:
  root_dir: artifacts/training
  trained_model_path: artifacts/training/model.pt
  quantized_model_path: artifacts/training/model_quantized.pt
  training_history_path: artifacts/training/training_history.json

evaluation:
  root_dir: artifacts/evaluation
  path_of_model: artifacts/training/model.pt
  quantized_model_path: artifacts/training/model_quantized.pt
  training_data: artifacts/data_ingestion/dataset/val
  score_file: scores.json
  mlflow_uri: https://dagshub.com/29omchavan/mlops-project-2-cnn-disease-classifier.mlflow
  experiment_name: cnn-disease-detection-v1
  registered_model_name: PoultryDiseaseResNetClassifier
